<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assessment — Papel Profissional</title>
<style>
:root{
  --plum:#4A3728;--plum-mid:#6B4F3A;--plum-light:#8C6E57;
  --rose:#C4956A;--rose-soft:#D4A87A;--rose-pale:#FBF3F9;
  --lavender:#F1E4EE;--border:#E8D5E4;--bg:#FFFFFF;--bg-alt:#FBF3F9;
  --sage:#2A6B4A;--muted:#9A7D8E;--text:#4A3728;
  --shadow:0 2px 8px rgba(74,55,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg-alt);min-height:100vh;color:var(--text)}

header{background:linear-gradient(135deg,var(--plum) 0%,var(--plum-mid) 100%);color:#fff;padding:22px 16px;text-align:center}
header h1{font-size:19px;font-weight:800;margin-bottom:4px;letter-spacing:-.3px}
header p{font-size:13px;opacity:.8}
#nome-cliente{font-size:16px;font-weight:700;background:rgba(255,255,255,.15);display:inline-block;padding:5px 16px;border-radius:20px;margin-top:10px;border:1px solid rgba(255,255,255,.25)}

.container{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--bg);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}

.instrucoes{border-left:4px solid var(--rose);padding-left:12px;font-size:13.5px;line-height:1.75;color:var(--plum-mid)}
.instrucoes strong{color:var(--plum)}
.instrucoes ul{margin:6px 0 0 18px}

.campo{margin-bottom:10px}
.campo label{display:block;font-size:13px;color:var(--plum);font-weight:700;margin-bottom:6px;line-height:1.4}
textarea{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-size:13.5px;font-family:inherit;resize:vertical;min-height:110px;color:var(--text)}
textarea:focus{outline:none;border-color:var(--rose)}

.btn-enviar{width:100%;padding:14px;background:linear-gradient(135deg,var(--plum) 0%,var(--plum-mid) 100%);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;transition:.2s}
.btn-enviar:hover{opacity:.88}
.btn-enviar:disabled{opacity:.45;cursor:not-allowed}

#loading,#confirmacao{display:none;text-align:center;padding:48px 20px}
#loading .spin{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--rose);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
#confirmacao .icon{font-size:64px;margin-bottom:14px}
#confirmacao h2{color:var(--plum);margin-bottom:8px;font-size:22px}
#confirmacao p{color:var(--muted);font-size:14px;line-height:1.7}

.erro-msg{text-align:center;padding:40px;color:#8B3A3A}

#save-status.salvo{color:var(--sage)}
#save-status.salvando{color:var(--muted)}
#save-status.erro{color:#8B3A3A}
</style>
</head>
<body>

<header>
  <h1>🪞 Assessment — Papel Profissional</h1>
  <p>Reflexão guiada</p>
  <div id="nome-cliente">Carregando...</div>
</header>

<div class="container" id="app">
  <div id="loading" style="display:block"><div class="spin"></div><p>Carregando...</p></div>
  <div id="erro-msg" class="erro-msg" style="display:none"></div>

  <div id="conteudo" style="display:none">
    <div class="card instrucoes">
      Reflita sobre como você se vê profissionalmente em relação ao seu papel e às suas responsabilidades atuais.
    </div>

    <div class="card">
      <div class="campo">
        <label>Ao refletir sobre o seu papel e suas responsabilidades atuais, o que você percebe que faz bem hoje?</label>
        <textarea id="resposta1" placeholder="Escreva aqui..." oninput="agendarAutoSave()"></textarea>
      </div>
    </div>

    <div class="card">
      <div class="campo">
        <label>Quais conhecimentos, habilidades e atitudes você reconhece que possui e que contribuem para o bom desempenho do seu papel e das suas responsabilidades atuais?</label>
        <textarea id="resposta2" placeholder="Escreva aqui..." oninput="agendarAutoSave()"></textarea>
      </div>
    </div>

    <div id="save-status" style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;min-height:16px"></div>
    <button class="btn-enviar" id="btn-enviar" onclick="enviar()">Enviar minha reflexão</button>
  </div>

  <div id="confirmacao">
    <div class="icon">🎉</div>
    <h2>Enviado!</h2>
    <p>Obrigada por compartilhar sua reflexão.<br>Sua psicóloga já pode ver sua resposta.</p>
  </div>
</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('t') || '';

async function init() {
  if (!TOKEN) { mostrarErro('Link inválido. Verifique com sua psicóloga.'); return; }
  try {
    const r = await fetch('/api/assessment-papel/info/' + TOKEN);
    if (!r.ok) { mostrarErro('Link inválido ou expirado.'); return; }
    const info = await r.json();
    document.getElementById('nome-cliente').textContent = info.paciente_nome;
    document.getElementById('resposta1').value = info.resposta1 || '';
    document.getElementById('resposta2').value = info.resposta2 || '';
    if (info.resposta1 || info.resposta2) {
      const st = document.getElementById('save-status');
      st.textContent = '✓ Você já tinha começado a preencher — continue de onde parou';
      st.className = 'salvo';
    }
    document.getElementById('loading').style.display = 'none';
    document.getElementById('conteudo').style.display = '';
  } catch(e) { mostrarErro('Erro ao carregar. Tente novamente. (' + e.message + ')'); }
}

function mostrarErro(msg) {
  document.getElementById('loading').style.display = 'none';
  const el = document.getElementById('erro-msg');
  el.style.display = '';
  el.innerHTML = '<div style="font-size:48px;margin-bottom:12px">😕</div><h2>Ops!</h2><p style="margin-top:8px">'+msg+'</p>';
}

function coletarRespostas() {
  return {
    resposta1: document.getElementById('resposta1').value.trim(),
    resposta2: document.getElementById('resposta2').value.trim()
  };
}

let saveTimer = null;
function agendarAutoSave() {
  clearTimeout(saveTimer);
  const st = document.getElementById('save-status');
  st.textContent = 'Salvando...';
  st.className = 'salvando';
  saveTimer = setTimeout(salvarAutomaticamente, 900);
}

async function salvarAutomaticamente() {
  const respostas = coletarRespostas();
  const st = document.getElementById('save-status');
  if (!respostas.resposta1 && !respostas.resposta2) { st.textContent = ''; return; }
  try {
    const r = await fetch('/api/assessment-papel/responder/' + TOKEN, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(respostas)
    });
    if (!r.ok) throw new Error();
    st.textContent = '✓ Salvo automaticamente';
    st.className = 'salvo';
  } catch(e) {
    st.textContent = 'Não foi possível salvar agora — verifique sua conexão';
    st.className = 'erro';
  }
}

async function enviar() {
  const btn = document.getElementById('btn-enviar');
  const respostas = coletarRespostas();
  if (!respostas.resposta1 && !respostas.resposta2) {
    alert('Escreva ao menos uma das respostas antes de enviar.');
    return;
  }
  clearTimeout(saveTimer);
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    const r = await fetch('/api/assessment-papel/responder/' + TOKEN, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(respostas)
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Erro');
    btn.textContent = '✓ Enviado';
    document.getElementById('conteudo').style.display = 'none';
    document.getElementById('confirmacao').style.display = '';
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Enviar minha reflexão';
    alert('Erro ao enviar: ' + e.message);
  }
}

init();
</script>
</body>
</html>
